name: iOS

on:
  pull_request:
  push:
    branches:
      - dev
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      lane:
        description: Release lane to run.
        required: true
        default: external-testflight
        type: choice
        options:
          - external-testflight
          - appstore
      version:
        description: Marketing version to build.
        required: true
        default: "0.1"
        type: string
      submit_external_review:
        description: Submit external TestFlight build for beta review.
        required: true
        default: true
        type: boolean
      submit_app_review:
        description: Submit the App Store build for review.
        required: true
        default: false
        type: boolean

env:
  PROJECT_PATH: techbrosbudget.xcodeproj
  SCHEME: techbrosbudget
  CONFIGURATION: Release
  DEFAULT_IOS_MARKETING_VERSION: "0.1"

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Build iOS ${{ matrix.ios-version }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - ios-version: "26.5"
            simulator-name: "iPhone 17 Pro Max"
            device-type: "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max"
            optional-runtime: false
          - ios-version: "27.0"
            simulator-name: "iPhone 17 Pro Max"
            device-type: "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max"
            optional-runtime: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Create simulator
        id: simulator
        env:
          IOS_RUNTIME_VERSION: ${{ matrix.ios-version }}
          IOS_SIMULATOR_NAME: ${{ matrix.simulator-name }}
          IOS_DEVICE_TYPE: ${{ matrix.device-type }}
          OPTIONAL_RUNTIME: ${{ matrix.optional-runtime }}
        run: |
          runtime_id="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_RUNTIME_VERSION//./-}"

          if xcrun simctl list runtimes available | grep -F "$runtime_id" >/dev/null; then
            device_id="$(xcrun simctl create "CI ${IOS_SIMULATOR_NAME} ${IOS_RUNTIME_VERSION}" "$IOS_DEVICE_TYPE" "$runtime_id")"
            echo "Created ${IOS_SIMULATOR_NAME} on iOS ${IOS_RUNTIME_VERSION}: ${device_id}"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "id=${device_id}" >> "$GITHUB_OUTPUT"
          elif [[ "$OPTIONAL_RUNTIME" == "true" ]]; then
            echo "::warning::${IOS_SIMULATOR_NAME} on iOS ${IOS_RUNTIME_VERSION} is not available on this hosted runner. Skipping optional ${IOS_RUNTIME_VERSION} test lane."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::${IOS_SIMULATOR_NAME} on iOS ${IOS_RUNTIME_VERSION} is required but unavailable."
            exit 1
          fi

      - name: Run build
        if: steps.simulator.outputs.available == 'true'
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}"

      - name: Skip unavailable optional runtime
        if: steps.simulator.outputs.available != 'true'
        run: |
          echo "Skipped iOS ${{ matrix.ios-version }} because this hosted runner does not provide that simulator runtime."

  external-testflight:
    name: External TestFlight
    needs: test
    runs-on: macos-26
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'external-testflight')
    environment: testflight-external
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install release tooling
        run: brew install asc jq

      - name: Configure App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: scripts/ci/setup-asc-key.sh

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: scripts/ci/setup-signing-cert.sh

      - name: Publish external TestFlight build
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_MARKETING_VERSION: ${{ inputs.version || vars.IOS_MARKETING_VERSION }}
          TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
          WORKFLOW_SUBMIT_EXTERNAL_REVIEW: ${{ inputs.submit_external_review }}
        run: |
          export IOS_MARKETING_VERSION="${IOS_MARKETING_VERSION:-$DEFAULT_IOS_MARKETING_VERSION}"
          export TESTFLIGHT_GROUP="${TESTFLIGHT_GROUP:-Tech Bros Budget Beta}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            export SUBMIT_EXTERNAL_REVIEW="${WORKFLOW_SUBMIT_EXTERNAL_REVIEW:-false}"
          else
            export SUBMIT_EXTERNAL_REVIEW="true"
          fi
          scripts/ci/publish-testflight.sh

  appstore:
    name: App Store Release
    needs: test
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.lane == 'appstore')
    environment: appstore-production
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install release tooling
        run: brew install asc jq

      - name: Configure App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: scripts/ci/setup-asc-key.sh

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: scripts/ci/setup-signing-cert.sh

      - name: Publish App Store build
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          WORKFLOW_VERSION: ${{ inputs.version }}
          WORKFLOW_SUBMIT_APP_REVIEW: ${{ inputs.submit_app_review }}
        run: |
          if [[ -n "${WORKFLOW_VERSION:-}" ]]; then
            export IOS_MARKETING_VERSION="$WORKFLOW_VERSION"
          else
            export IOS_MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            export SUBMIT_APP_REVIEW="${WORKFLOW_SUBMIT_APP_REVIEW:-false}"
          else
            export SUBMIT_APP_REVIEW="true"
          fi
          scripts/ci/publish-appstore.sh
